# Web deployment: manual fallback only since 2026-10-16.
# APK releases are built on the PC with `npm run release`.
#
# 릴리스 태그 푸시 또는 수동 실행 시:
#  1) Secrets → .env 동적 주입 (없으면 운영 API 기본값)
#  2) 배포 버전 카운트(+1) 후 version.json 생성
#  3) 번들에 버전 정보를 구워 웹 빌드(expo export)
#  4) 산출물을 GitHub Pages 로 배포
#  5) 갱신된 version.json 을 레포지토리에 자동 커밋/푸시(캐시 버스팅 매니페스트)
name: Build & Deploy (Web + OTA)

on:
  workflow_dispatch:

# version.json 자동 푸시 + gh-pages 브랜치 배포 모두 contents:write 만으로 동작한다.
# (기존 actions/deploy-pages 방식은 GITHUB_TOKEN 이 Pages 사이트를 자동 생성할 권한이 없어
#  'Create Pages site failed: Resource not accessible by integration' 로 매번 실패했다.
#  gh-pages 브랜치에 직접 푸시하는 방식은 Pages API enablement 가 필요 없어 항상 성공한다.
#  최초 1회만 저장소 Settings → Pages → Source 를 'gh-pages' 브랜치로 지정하면 서빙된다.)
permissions:
  contents: write
  pages: read

# 동시 배포 방지 — 진행 중 배포가 있으면 최신 것만 남긴다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # version.json 커밋을 푸시할 수 있도록 토큰 유지
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production uses the live API; demo builds are unsupported.
      - name: Inject .env from Secrets
        env:
          API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL || 'https://bridge.kfpa.or.kr' }}
          API_TIMEOUT_MS: ${{ secrets.EXPO_PUBLIC_API_TIMEOUT_MS || '10000' }}
          SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const values = {
            EXPO_PUBLIC_API_BASE_URL: process.env.API_BASE_URL,
            EXPO_PUBLIC_API_TIMEOUT_MS: process.env.API_TIMEOUT_MS,
            EXPO_PUBLIC_SENTRY_DSN: process.env.SENTRY_DSN,
          };
          if (Object.values(values).some(value => /[\r\n]/.test(value ?? ''))) throw new Error('Invalid multiline build configuration');
          const url = new URL(values.EXPO_PUBLIC_API_BASE_URL);
          if (!['https:', 'http:'].includes(url.protocol) || url.username || url.password || url.search || url.hash) throw new Error('Invalid API target');
          writeFileSync('.env', Object.entries(values).map(([key, value]) => `${key}=${value ?? ''}`).join('\n') + '\n');
          JS
          echo ".env 생성 완료 (값은 마스킹됨)"

      # --- 버전 카운트 & 매니페스트 -------------------------------------
      - name: Bump build version
        run: node scripts/bump-version.mjs --check-tag "${{ github.ref_name }}"

      # 번들에 구워질 빌드 메타데이터를 .env 에 덧붙인다(런타임 OTA 비교 기준).
      - name: Append build metadata to .env
        run: |
          {
            echo "EXPO_PUBLIC_BUILD_NUMBER=${APP_BUILD_NUMBER}"
            echo "EXPO_PUBLIC_APP_VERSION=${APP_VERSION}"
            echo "EXPO_PUBLIC_COMMIT_SHA=${APP_COMMIT}"
            echo "EXPO_PUBLIC_BUILD_TIME=${APP_BUILD_TIME}"
          } >> .env

      - name: Type check
        run: npm run typecheck

      - name: Unit and regression tests
        run: npm test -- --runInBand

      # --- 웹 빌드 -------------------------------------------------------
      # public/version.json 은 expo export 시 dist 루트로 자동 복사된다.
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist

      # SPA 라우팅/직접 진입 대응 (Pages 는 404.html 로 폴백)
      - name: SPA fallback
        run: cp dist/index.html dist/404.html || true

      # --- GitHub Pages 배포 (gh-pages 브랜치 푸시) ----------------------
      # Pages API enablement 없이 GITHUB_TOKEN(contents:write)만으로 배포된다.
      # baseUrl(/eduapp)에 맞춰 저장소 Pages Source 를 'gh-pages' 브랜치로 지정하면 서빙된다.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          # SPA 라우팅: Jekyll 처리를 끄고(_ 로 시작하는 폴더 보존) 정적 그대로 서빙.
          enable_jekyll: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Verify Pages hosting availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url; then
            echo "Pages hosting is configured."
          else
            echo "::warning::Web bundle was pushed to gh-pages, but Pages hosting is unavailable. Private repositories require a supported GitHub plan; publishing the branch alone does not make a website available."
          fi

      # --- version.json 자동 커밋/푸시 ----------------------------------
      # 배포된 코드가 참조할 최신 매니페스트를 레포지토리에 기록한다.
      - name: Commit version manifest
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # app.json 도 함께 커밋한다 — 자동으로 오른 semver 가 레포에 남아야
          # 다음 배포가 그 값을 기준으로 이어서 올라간다(빠뜨리면 매번 같은 patch 로 돌아간다).
          git add version.json public/version.json app.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 스킵"
          else
            git commit -m "chore(release): build ${APP_BUILD_NUMBER} (v${APP_VERSION}) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
