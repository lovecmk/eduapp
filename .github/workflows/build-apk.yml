# Android APK 빌드 (로컬 빌드 · Expo 계정/EAS 불필요)
#
# GitHub 러너에서 직접 네이티브 빌드를 수행한다.
#  1) npm ci → .env 주입(시크릿 없으면 목업 폴백)
#  2) Android SDK/NDK(35, ndk 27.1) 설치
#  3) `expo prebuild` 로 android/ 생성
#  4) `gradlew assembleRelease` 로 APK 생성
#     (Expo 템플릿은 release 를 debug 키로 서명하므로 그대로 설치 가능한 APK 가 나온다)
#  5) APK 를 아티팩트로 업로드(main 은 릴리스 자산으로 대체 → 용량 절약)
#  6) main 일 때만: GitHub Release 발행(APK 첨부) + 완료 메일 발송
#
# EAS(클라우드) 빌드는 eas-build.yml 이 담당한다. 이 워크플로는 EXPO_TOKEN 이 필요 없다.
#
# 메일 알림을 켜려면 저장소 Settings → Secrets → Actions 에 아래를 추가한다(선택):
#   MAIL_USERNAME  보내는 Gmail 주소
#   MAIL_PASSWORD  Gmail 앱 비밀번호(2단계 인증 후 발급, 일반 비밀번호 아님)
#   MAIL_TO        받는 주소(미설정 시 기본값 사용)
# 시크릿이 없으면 메일 단계는 건너뛰고 릴리스/빌드는 정상 진행된다.
name: Build Android APK (Local)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api:
        description: '이 APK 가 볼 서버'
        type: choice
        default: 'production'
        options:
          - production   # https://bridge.kfpa.or.kr (DMZ1 · 배포용)
          - test         # http://test.inplat.org:8090 (사내망 전용 · 평문)

# contents: 릴리스 생성 및 태그 푸시 / actions: 낡은 아티팩트 정리(용량 확보).
permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 서버 주소는 시크릿이 아니라 여기서 정한다.
      #
      # 예전에는 시크릿이 비어 있으면 그대로 빈 값이 들어갔고, env.ts 가 그것을
      # "주소 없음 → 목업"으로 읽어 **아무것도 저장되지 않는 APK 가 배포되었다**.
      # 화면은 멀쩡히 돌기 때문에 받아 본 사람도, 만든 사람도 알아채지 못한다.
      # 주소는 공개된 호스트명이라 감출 이유가 없으므로 워크플로에 적어 두고,
      # 수동 실행 시 드롭다운으로 테스트/목업을 고를 수 있게 한다.
      - name: Resolve API target
        id: api
        run: |
          case "${{ inputs.api || 'production' }}" in
            test) URL="http://test.inplat.org:8090" ;;
            *)    URL="https://bridge.kfpa.or.kr" ;;
          esac
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "이 APK 가 볼 서버: ${URL:-(목업)}"

      - name: Inject .env
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_API_BASE_URL=${{ steps.api.outputs.url }}
          EXPO_PUBLIC_API_TIMEOUT_MS=${{ secrets.EXPO_PUBLIC_API_TIMEOUT_MS || '10000' }}
          EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EOF
          echo ".env 생성 완료"

      - name: Type check
        run: npm run typecheck

      # 웹과 같은 원본 커밋에서 같은 다음 버전/빌드 번호를 계산한다.
      # 기록 커밋은 웹 배포만 수행하므로 중복 push/build를 만들지 않는다.
      - name: Bump build version
        run: node scripts/bump-version.mjs --check-tag "${{ github.ref_name }}"

      - name: Append build metadata to .env
        run: |
          {
            echo "EXPO_PUBLIC_BUILD_NUMBER=${APP_BUILD_NUMBER}"
            echo "EXPO_PUBLIC_APP_VERSION=${APP_VERSION}"
            echo "EXPO_PUBLIC_COMMIT_SHA=${APP_COMMIT}"
            echo "EXPO_PUBLIC_BUILD_TIME=${APP_BUILD_TIME}"
          } >> .env

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 기본값의 폐기된 'tools' 패키지는 SDK 저장소에서 찾을 수 없다.
          packages: platform-tools

      # RN 0.76.9(SDK 52) 이 요구하는 정확한 패키지 버전으로 고정.
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      # android/ 네이티브 프로젝트 생성 (Expo 로그인 불필요).
      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: collect
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          SRC=android/app/build/outputs/apk/release/app-release.apk
          mkdir -p out
          APK_NAME="eduapp-v${APP_VERSION}-${SHORT_SHA}.apk"
          cp "$SRC" "out/${APK_NAME}"
          {
            echo "apk_path=out/${APK_NAME}"
            echo "apk_name=${APK_NAME}"
            echo "version=${APP_VERSION}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "### 📦 APK 빌드 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 파일: \`${APK_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 크기: $(du -h "out/${APK_NAME}" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # 아티팩트 저장 용량은 계정 단위로 한도가 있고, 초과하면 업로드가
      # 'Artifact storage quota has been hit' 로 실패한다. APK 하나가 수십 MB 라
      # 쌓이면 금방 한도에 닿으므로, 올리기 전에 이 워크플로가 만든 낡은 APK
      # 아티팩트를 지워 자리를 비운다(최신 1개만 남긴다).
      # 주의: GitHub 의 사용량 집계는 6~12시간마다 갱신되므로, 지운 직후에도
      # 한도 표시가 남아 있을 수 있다. 그래서 아래 업로드는 실패해도 잡을
      # 죽이지 않는다(APK 는 릴리스 자산으로도 배포된다).
      - name: Prune old APK artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("eduapp-android-apk")) | "\(.id) \(.created_at) \(.size_in_bytes)"' \
            | sort -k2 -r | tail -n +2 > "$RUNNER_TEMP/stale.txt" || true
          if [ ! -s "$RUNNER_TEMP/stale.txt" ]; then
            echo "지울 낡은 아티팩트 없음"
            exit 0
          fi
          FREED=0
          while read -r ID CREATED SIZE; do
            echo "삭제: artifact ${ID} (${CREATED}, $((SIZE / 1024 / 1024))MB)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}" || true
            FREED=$((FREED + SIZE))
          done < "$RUNNER_TEMP/stale.txt"
          echo "확보한 용량: $((FREED / 1024 / 1024))MB"

      # main 은 아래에서 GitHub Release 에 같은 APK 를 첨부한다. 릴리스 자산은
      # 아티팩트 쿼터를 쓰지 않으므로, main 에서는 아티팩트를 중복으로 올리지
      # 않는다. (다른 브랜치/수동 실행에서는 릴리스가 없으므로 아티팩트가 유일한
      # 산출물 → 그때만 업로드한다.)
      - name: Upload APK artifact (non-main only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: eduapp-android-apk
          path: ${{ steps.collect.outputs.apk_path }}
          if-no-files-found: error
          # 30일 → 5일. 보관 기간이 곧 점유 용량이다.
          retention-days: 5

      # ---- 이하 main 브랜치에서만 실행 ----

      - name: Create GitHub Release (main only)
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}-${{ steps.collect.outputs.short_sha }}
          name: 현장학습 v${{ steps.collect.outputs.version }} (${{ steps.collect.outputs.short_sha }})
          prerelease: true
          fail_on_unmatched_files: true
          files: ${{ steps.collect.outputs.apk_path }}
          body: |
            자동 빌드된 Android 테스트 APK (디버그 서명 → 바로 설치 가능).

            - 파일: `${{ steps.collect.outputs.apk_name }}`
            - 커밋: ${{ github.sha }}

            **설치:** 아래 자산에서 APK 를 내려받아 실행(설정 → 출처를 알 수 없는 앱 허용),
            또는 `adb install ${{ steps.collect.outputs.apk_name }}`.

      # 메일 시크릿 유무 확인 — 없으면 메일 단계를 건너뛴다.
      - name: Check mail config (main only)
        id: mailcfg
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "${{ secrets.MAIL_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MAIL_PASSWORD Secret 미설정 — 이메일 알림을 건너뜁니다."
          fi

      - name: Email release link (main only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.mailcfg.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: eduapp CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO || 'mrwjs0803@gmail.com' }}
          subject: "[현장학습] APK 빌드 완료 v${{ steps.collect.outputs.version }} (${{ steps.collect.outputs.short_sha }})"
          body: |
            main 브랜치 빌드가 완료되었습니다.

            릴리스: ${{ steps.release.outputs.url }}
            APK: ${{ steps.collect.outputs.apk_name }}
            커밋: ${{ github.sha }}

            위 릴리스 페이지에서 APK 를 내려받아 설치하세요 (GitHub 로그인 필요).
