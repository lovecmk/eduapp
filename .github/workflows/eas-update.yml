# EAS Update — 모바일 앱 OTA(무선) 자동 업데이트
#
# main 브랜치에 푸시되면 JS/에셋 변경분을 EAS Update 로 게시한다.
# production 채널에 연결된 기존 네이티브 빌드(스토어 배포본)는 다음 실행 시
# 자동으로 새 번들을 내려받아 적용한다(app.json 의 checkAutomatically: ON_LOAD).
#
# 사전 준비(사용자 1회 설정):
#   1) Expo 계정 personal access token 을 GitHub 저장소 Secret 으로 추가: EXPO_TOKEN
#   2) `eas init` 으로 프로젝트 생성 → app.json 의 extra.eas.projectId 자동 기록,
#      이어서 `eas update:configure` 로 updates.url 자동 구성
#   자세한 절차는 docs/EAS.md 참고.
name: EAS Update (OTA)

on:
  push:
    branches: [main]
    # 네이티브 재빌드가 필요 없는(순수 JS/에셋) 변경만 OTA 대상.
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'scripts/bump-version.mjs'
      - 'scripts/version-core.cjs'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: '게시할 EAS Update 브랜치(채널)'
        required: true
        default: 'production'
        type: choice
        options: [production, preview, development]

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — EXPO_TOKEN 확인
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN Secret 이 없습니다. 저장소 Settings → Secrets → Actions 에 추가하세요."
            exit 1
          fi

      - name: Setup Node
        # eas-cli(latest)가 Node 22 이상을 요구한다. 20 에서는 설치 단계가
        # "@oclif/plugin-autocomplete … Expected version >=22.0.0" 로 멈춰,
        # OTA 게시가 한 줄도 실행되지 못한 채 실패했다.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Bump build version
        run: node scripts/bump-version.mjs

      # APK/Web와 버전 메타데이터를 맞추고, 미설정 주소 때문에 목업 OTA가
      # production에 게시되는 것을 막는다.
      - name: Inject production config and build metadata
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_API_BASE_URL=https://bridge.kfpa.or.kr
          EXPO_PUBLIC_API_TIMEOUT_MS=${{ secrets.EXPO_PUBLIC_API_TIMEOUT_MS || '10000' }}
          EXPO_PUBLIC_USE_MOCK_DATA=false
          EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_BUILD_NUMBER=${APP_BUILD_NUMBER}
          EXPO_PUBLIC_APP_VERSION=${APP_VERSION}
          EXPO_PUBLIC_COMMIT_SHA=${APP_COMMIT}
          EXPO_PUBLIC_BUILD_TIME=${APP_BUILD_TIME}
          EOF

      - name: Publish OTA update
        # 커밋 메시지를 셸에 직접 넣지 않고 env 로 전달(스크립트 인젝션 방지).
        env:
          UPDATE_BRANCH: ${{ github.event.inputs.branch || 'production' }}
          UPDATE_MESSAGE: ${{ github.event.head_commit.message || format('manual publish by {0}', github.actor) }}
        run: |
          eas update \
            --branch "$UPDATE_BRANCH" \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
