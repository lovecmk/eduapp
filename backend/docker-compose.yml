# eduapp 백엔드 — 이식 가능한 원클릭 스택.
#
# 두 가지 프로파일로 "테스트"와 "운영"을 한 파일에서 전환한다.
# 값은 모두 .env 로 주입되므로(12-factor) 사내 서버·외부 VM·클라우드 어디서든 동일.
#
#   • 테스트(무 DB, 즉시 올려보기):
#         docker compose --profile test up --build
#       → API 컨테이너 하나(STORE=memory). 재시작하면 데이터 초기화(데모에 이상적).
#
#   • 운영(영속 DB + 자동 HTTPS):
#         cp .env.example .env   # DOMAIN, JWT_SECRET, POSTGRES_PASSWORD 채우기
#         docker compose --profile prod up -d --build
#       → Caddy(HTTPS) → API(STORE=postgres) → PostgreSQL(볼륨 영속).
#
# 이식: `.env` 복사 + `make backup` 로 뜬 덤프를 새 호스트에서 복원하면 끝.

# 공통 API 이미지/빌드 정의(YAML 앵커로 테스트·운영이 재사용).
x-api-image: &api-image
  build:
    context: .
  image: eduapp-api:local
  restart: unless-stopped

# 공통 API 환경변수(비밀·주소는 .env 에서, 기본값은 여기서).
# 주의: 아래 기본값은 "테스트를 무설정으로 즉시 올리기" 위한 것. 운영(prod)에서는
#       .env 에서 JWT_SECRET(make secret) 과 POSTGRES_PASSWORD 를 반드시 교체한다.
#       기본 비밀로 postgres 스토어를 켜면 서버가 부팅 로그에 경고를 남긴다.
x-api-env: &api-env
  PORT: "8080"
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
  ACCESS_TTL: ${ACCESS_TTL:-15m}
  REFRESH_TTL: ${REFRESH_TTL:-720h}
  SEED_ON_START: ${SEED_ON_START:-true}
  APP_VERSION: ${APP_VERSION:-dev}
  STUDY_SESSION_SEC: ${STUDY_SESSION_SEC:-180}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}
  # 게이트웨이가 붙여 보내는 외부 경로 접두사(로케이션 블록과 같은 값).
  API_PREFIX: ${API_PREFIX:-/inner/api/v1}
  EXPO_PUSH_URL: ${EXPO_PUSH_URL:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_ALLOWED_CHATS: ${TELEGRAM_ALLOWED_CHATS:-}
  TELEGRAM_POLL: ${TELEGRAM_POLL:-true}

services:
  # ── 테스트 프로파일: 무 DB API 한 개 ───────────────────────────
  api-test:
    <<: *api-image
    profiles: ["test"]
    environment:
      <<: *api-env
      STORE: memory
    ports:
      - "${API_PORT:-8080}:8080"

  # ── 운영 프로파일: PostgreSQL + API + Caddy ────────────────────
  postgres:
    image: postgres:16-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduapp}
      POSTGRES_DB: ${POSTGRES_DB:-eduapp}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduapp} -d ${POSTGRES_DB:-eduapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *api-image
    profiles: ["prod"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
      STORE: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-eduapp}:${POSTGRES_PASSWORD:-eduapp}@postgres:5432/${POSTGRES_DB:-eduapp}?sslmode=disable
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # DOMAIN 이 있으면 자동 HTTPS(Let's Encrypt), 없으면 :80 로 로컬/사내 노출.
      SITE_ADDRESS: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 기본은 API 프록시 전용 Caddyfile. 올인원(웹+API) 배포는 CADDYFILE=Caddyfile.web 로 바꾼다
      # (make up-web). 웹 정적 루트(../dist)는 항상 마운트해 두되, 기본 Caddyfile 은 이를 무시한다.
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ../dist:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pg-data:
  caddy-data:
  caddy-config:
